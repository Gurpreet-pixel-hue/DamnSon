[project]
name = "civicweave-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jai Kukreja", email = "jaikukreja1403@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography==43.0.3",
    "fastapi==0.141.1",
    "google-genai==2.25.0",
    "groq==1.7.0",
    "httpx==0.28.1",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "pyyaml>=6.0.3",
    "trafilatura==2.2.0",
    "uvicorn==0.54.0",
]

[project.scripts]
civicweave-ai = "civicweave_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["google.*", "pymupdf.*", "trafilatura.*", "pgvector.*", "yaml.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
